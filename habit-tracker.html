<title>Habit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column phone-first; stats on top, the month grid as the working surface, analysis under it.
   Look: a paper ledger – warm stone neutrals, charcoal ink for "done", one muted olive accent. */
:root{
  --bg:#f1ede6;
  --paper:#faf8f4;
  --paper-2:#ebe6dd;
  --line:#d9d2c6;
  --line-strong:#b9b0a1;
  --ink:#231f1b;
  --ink-2:#5c554c;
  --ink-3:#8c8478;
  --done:#2e2a26;
  --done-fg:#f5f1ea;
  --accent:#6f7a4a;
  --accent-soft:#e3e6d3;
  --today:#f0e4c8;
  --warn:#b4542e;
  --shadow:0 1px 2px rgba(35,31,27,.06),0 8px 24px -12px rgba(35,31,27,.18);
  --font-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cell:30px;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191714; --paper:#221f1b; --paper-2:#2b2723; --line:#39342e; --line-strong:#56504a;
    --ink:#efe9df; --ink-2:#b5ab9d; --ink-3:#7f776c; --done:#e9e1d4; --done-fg:#1b1917;
    --accent:#a9b47a; --accent-soft:#333827; --today:#3a3222; --warn:#e08b63;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191714; --paper:#221f1b; --paper-2:#2b2723; --line:#39342e; --line-strong:#56504a;
  --ink:#efe9df; --ink-2:#b5ab9d; --ink-3:#7f776c; --done:#e9e1d4; --done-fg:#1b1917;
  --accent:#a9b47a; --accent-soft:#333827; --today:#3a3222; --warn:#e08b63;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:inherit}
.app{max-width:1100px;margin:0 auto;padding-block:14px 48px;padding-inline:16px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:30px;font-weight:700;line-height:1}
.brand .sub{color:var(--ink-2);font-size:13px;margin-top:4px}
.monthnav{display:flex;align-items:center;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.monthnav button{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2)}
.monthnav button:hover{background:var(--paper-2);color:var(--ink)}
.monthnav .label{min-width:150px;text-align:center;font-family:var(--font-display);font-weight:700;font-size:17px}
.monthnav .today-btn{width:auto;padding-inline:12px;font-size:13px;font-weight:600;color:var(--accent)}
.sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:inline-block}
.sync.on i{background:var(--accent)}

/* cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 16px 0}
.card .body{padding:12px 16px 16px}

/* overview */
.overview{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:720px){.overview{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:16px}
.tiles{display:grid;gap:8px}
.tile{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 12px;border-radius:8px;background:var(--paper-2)}
.tile b{font-family:var(--font-display);font-size:22px;font-weight:700}
.tile span{font-size:12px;color:var(--ink-2)}
.donut{position:relative;width:118px;height:118px}
.donut svg{width:100%;height:100%;display:block}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.donut .c b{font-family:var(--font-display);font-size:24px}
.donut .c span{font-size:11px;color:var(--ink-3)}
.chart{width:100%;height:132px;display:block}
.chart text{font-family:var(--font-body);font-size:10px;fill:var(--ink-3)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--done)}
.chart .bar.future{fill:var(--line)}
.chart .bar.today{fill:var(--accent)}
.chart .bar:hover{opacity:.75}
.chart .lbl{fill:var(--ink-2);font-weight:600}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 9px;border-radius:7px;transform:translate(-50%,calc(-100% - 10px));white-space:nowrap;opacity:0;transition:opacity .12s}
.tip.show{opacity:1}

/* grid */
.gridwrap{overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line);border-bottom-left-radius:var(--radius);border-bottom-right-radius:var(--radius)}
table.grid{border-collapse:separate;border-spacing:0;font-size:13px;min-width:max-content}
.grid th,.grid td{padding:0;height:var(--cell);text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.grid th{font-weight:500;color:var(--ink-3);font-size:11px}
.grid th.wk{font-weight:600;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase;font-size:10px;border-left:1px solid var(--line-strong);background:var(--paper-2)}
.grid th.wk.first{border-left:0}
.grid .name{position:sticky;left:0;z-index:2;background:var(--paper);text-align:left;padding-inline:14px 12px;min-width:170px;max-width:220px;border-right:1px solid var(--line-strong)}
.grid thead .name{background:var(--paper-2)}
.grid .name button{display:flex;align-items:center;gap:8px;width:100%;height:var(--cell);text-align:left;font-weight:500;overflow:hidden}
.grid .name button span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid .name .em{width:20px;text-align:center;flex:none}
.grid td.d{width:var(--cell);min-width:var(--cell);border-left:1px solid var(--line)}
.grid td.d.wk{border-left:1px solid var(--line-strong)}
.grid td.d.first{border-left:0}
.grid th.d{width:var(--cell);min-width:var(--cell)}
.grid th.d.today,.grid td.d.today{background:var(--today)}
.grid th.d.today{color:var(--ink);font-weight:700}
.grid td.d.future{opacity:.55}
.chk{width:100%;height:100%;display:grid;place-items:center}
.chk i{width:17px;height:17px;border:1.5px solid var(--line-strong);border-radius:4px;display:grid;place-items:center;transition:background .12s,border-color .12s;background:var(--paper)}
.chk i svg{width:11px;height:11px;opacity:0;stroke:var(--done-fg);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.chk.on i{background:var(--done);border-color:var(--done)}
.chk.on i svg{opacity:1}
.chk:hover i{border-color:var(--ink-2)}
tr.scale td.d{font-size:12px;color:var(--ink-3)}
tr.scale .name{color:var(--ink-2);font-size:12px;font-weight:600}
tr.scale td.d button{width:100%;height:100%;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-3)}
tr.scale td.d button.v1{color:var(--ink-3)}
tr.scale td.d button.v2{color:var(--ink-2)}
tr.scale td.d button.v3{color:var(--ink);background:color-mix(in oklab,var(--accent) 12%,transparent)}
tr.scale td.d button.v4{color:var(--ink);background:color-mix(in oklab,var(--accent) 26%,transparent)}
tr.scale td.d button.v5{color:var(--done-fg);background:var(--accent)}
tr.sep td{height:10px;background:var(--paper-2);border-bottom:1px solid var(--line)}
tr.sep .name{background:var(--paper-2)}
.grid tfoot td{height:auto;border:0}
.add-row{display:flex;gap:8px;padding:12px 14px;align-items:center;position:sticky;left:0}
.add-row input{flex:1;min-width:0;max-width:280px;height:38px;border:1px solid var(--line-strong);border-radius:9px;padding-inline:12px;background:var(--paper)}
.btn{height:38px;padding-inline:14px;border-radius:9px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--done);color:var(--done-fg)}
.btn.ghost{border:1px solid var(--line-strong);color:var(--ink-2)}
.btn.danger{color:var(--warn);border:1px solid color-mix(in oklab,var(--warn) 40%,transparent)}
.btn:hover{filter:brightness(1.05)}
.hint{padding:12px 16px;color:var(--ink-3);font-size:13px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-family:var(--font-display);font-size:18px;color:var(--ink);margin-bottom:4px}

/* analysis */
.bottom{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:820px){.bottom{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.tablewrap{overflow-x:auto;margin-inline:-16px;padding-inline:16px}
table.an{width:100%;min-width:480px;border-collapse:collapse;font-size:13px}
.an td:first-child{white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.an th{font-weight:600;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.05em;text-align:right;padding:4px 8px;border-bottom:1px solid var(--line)}
.an th:first-child,.an td:first-child{text-align:left;padding-left:0}
.an td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
.an td.bar{width:38%;min-width:110px;padding-right:0}
.an tr:last-child td{border-bottom:0}
.pbar{display:flex;align-items:center;gap:8px}
.pbar .track{flex:1;height:9px;background:var(--paper-2);border-radius:999px;overflow:hidden}
.pbar .fill{height:100%;background:var(--done);border-radius:999px;transition:width .3s}
.pbar b{min-width:36px;text-align:right;font-weight:600;font-size:12px}
.rank{list-style:none;margin:0;padding:0;display:grid}
.rank li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rank li:last-child{border-bottom:0}
.rank .pos{font-family:var(--font-display);font-weight:700;color:var(--ink-3)}
.rank li:nth-child(-n+3) .pos{color:var(--accent)}
.rank .cnt{font-size:12px;color:var(--ink-2)}

/* modal */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:end center;background:rgba(20,16,12,.45);padding:12px}
@media (min-width:600px){.modal{place-items:center}}
.sheet{width:100%;max-width:440px;background:var(--paper);border-radius:16px;padding:18px;display:grid;gap:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.sheet h3{font-size:19px}
.field{display:grid;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field input{height:42px;border:1px solid var(--line-strong);border-radius:9px;padding-inline:12px;background:var(--paper);width:100%}
.field .row{display:grid;grid-template-columns:72px 1fr;gap:8px}
.field small{color:var(--ink-3);font-size:12px}
.sheet .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.sheet .actions .r{display:flex;gap:8px;margin-left:auto}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:999px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1>Habit Tracker</h1>
      <div class="sub" id="subtitle">Denné návyky, jeden mesiac na jednej obrazovke.</div>
    </div>
    <div style="display:grid;gap:6px;justify-items:end">
      <div class="monthnav">
        <button id="prev" aria-label="Predchádzajúci mesiac">&#8249;</button>
        <div class="label" id="monthLabel">–</div>
        <button id="next" aria-label="Nasledujúci mesiac">&#8250;</button>
        <button class="today-btn" id="goToday">Dnes</button>
      </div>
      <div class="sync" id="sync"><i></i><span>Načítavam…</span></div>
    </div>
  </header>

  <section class="overview">
    <div class="card stats">
      <div class="donut">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="48" fill="none" stroke="var(--paper-2)" stroke-width="14"></circle>
          <circle id="donutArc" cx="60" cy="60" r="48" fill="none" stroke="var(--done)" stroke-width="14" stroke-linecap="butt" stroke-dasharray="0 301.6" transform="rotate(-90 60 60)"></circle>
        </svg>
        <div class="c"><b class="num" id="pct">0 %</b><span>splnené</span></div>
      </div>
      <div class="tiles">
        <div class="tile"><span>Cieľ</span><b class="num" id="sGoal">0</b></div>
        <div class="tile"><span>Splnené</span><b class="num" id="sDone">0</b></div>
        <div class="tile"><span>Zostáva</span><b class="num" id="sLeft">0</b></div>
      </div>
    </div>
    <div class="card">
      <div class="head"><h2>Denný pokrok</h2><span class="eyebrow" id="dailyAvg"></span></div>
      <div class="body"><svg class="chart" id="dailyChart" role="img" aria-label="Percento splnených návykov za každý deň"></svg></div>
    </div>
    <div class="card">
      <div class="head"><h2>Týždenný pokrok</h2><span class="eyebrow" id="weeklyBest"></span></div>
      <div class="body"><svg class="chart" id="weeklyChart" role="img" aria-label="Percento splnených návykov za každý týždeň"></svg></div>
    </div>
  </section>

  <section class="card" id="gridCard">
    <div class="head"><h2>Moje návyky</h2><span class="eyebrow" id="gridInfo"></span></div>
    <div class="hint" id="gridHint">Ťukni na políčko, keď máš návyk splnený. Ťukni na názov návyku pre úpravu.</div>
    <div class="gridwrap" id="gridwrap"></div>
  </section>

  <section class="bottom">
    <div class="card">
      <div class="head"><h2>Analýza</h2><span class="eyebrow">Cieľ · splnené · zostáva</span></div>
      <div class="body" id="analysis"></div>
    </div>
    <div class="card">
      <div class="head"><h2>Top návyky</h2><span class="eyebrow">tento mesiac</span></div>
      <div class="body" id="top"></div>
    </div>
  </section>
</div>

<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
(function(){
'use strict';
const $ = (s, el=document) => el.querySelector(s);
const MONTHS = ['Január','Február','Marec','Apríl','Máj','Jún','Júl','August','September','Október','November','December'];
const DOW = ['Ne','Po','Ut','St','Št','Pi','So'];
const DEFAULT_HABITS = [
  ['⏰','Vstať o 6:00'],['🧘','Meditácia'],['🏋️','Gym'],['🚿','Studená sprcha'],['💼','Práca'],
  ['📖','Prečítať 10 strán'],['🧠','Učiť sa novú zručnosť'],['🍬','Bez cukru'],['🍺','Bez alkoholu'],
  ['📱','Max. 1 h sociálne siete'],['📝','Plánovanie'],['🌙','Spať pred 23:00']
];

const now = new Date();
const pad = n => String(n).padStart(2,'0');
const ymOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1);
const TODAY = {ym: ymOf(now), d: now.getDate()};

const state = {
  ym: TODAY.ym,
  habits: [],            // [{id,name,emoji,goal,order}]
  month: null,           // {checks:{hid:{"3":1}}, mood:{"3":4}, motivation:{"3":2}}
  loadedHabits: false,
  mode: 'local'          // 'local' | 'db'
};

/* ---------- storage ---------- */
let db = null;
let unsubMonth = null;
const writers = new Map();
async function writeDoc(ref, data){
  let w = writers.get(ref.path);
  if(!w){ w = {busy:false, next:null}; writers.set(ref.path, w); }
  w.next = data;
  if(w.busy) return;
  w.busy = true;
  try{
    while(w.next){
      const d = w.next; w.next = null;
      try{ await ref.set(d); }
      catch(e){ toast('Uloženie zlyhalo: '+(e && e.code ? e.code : 'chyba')); }
    }
  } finally { w.busy = false; }
}
function lsGet(k, fallback){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

function emptyMonth(){ return {checks:{}, mood:{}, motivation:{}}; }
function normMonth(m){ m = m || {}; return {checks:m.checks||{}, mood:m.mood||{}, motivation:m.motivation||{}}; }

function saveHabit(h){
  if(state.mode==='db'){ writeDoc(db.doc('habits/'+h.id), {name:h.name, emoji:h.emoji, goal:h.goal??null, order:h.order}); }
  else lsSet('ht_habits', state.habits);
}
function deleteHabit(id){
  state.habits = state.habits.filter(h=>h.id!==id);
  if(state.mode==='db'){ db.doc('habits/'+id).delete().catch(()=>toast('Odstránenie zlyhalo')); }
  else lsSet('ht_habits', state.habits);
}
function saveMonth(){
  if(state.mode==='db'){ writeDoc(db.doc('months/'+state.ym), state.month); }
  else lsSet('ht_month_'+state.ym, state.month);
}

function loadMonth(){
  if(unsubMonth){ unsubMonth(); unsubMonth = null; }
  if(state.mode==='db'){
    state.month = emptyMonth();
    render();
    unsubMonth = db.doc('months/'+state.ym).onSnapshot(snap=>{
      state.month = snap.exists ? normMonth(snap.data()) : emptyMonth();
      render();
    }, e=>{ toast('Spojenie s úložiskom sa prerušilo'); });
  } else {
    state.month = normMonth(lsGet('ht_month_'+state.ym, null));
    render();
  }
}

async function initStore(){
  try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){ db = null; }
  if(db){
    state.mode = 'db';
    setSync(true, 'Ukladá sa do cloudu');
    db.collection('habits').orderBy('order').onSnapshot(snap=>{
      state.habits = snap.docs.map(d=>{ const x = d.data()||{}; return {id:d.id, name:x.name||'', emoji:x.emoji||'', goal:(x.goal==null?null:Number(x.goal)), order:Number(x.order)||0}; });
      state.loadedHabits = true;
      render();
    }, e=>{ toast('Načítanie návykov zlyhalo'); state.loadedHabits = true; render(); });
  } else {
    state.mode = 'local';
    setSync(false, 'Uložené len v tomto prehliadači');
    let hs = lsGet('ht_habits', null);
    if(!hs){ hs = DEFAULT_HABITS.map(([e,n],i)=>({id:newId(), name:n, emoji:e, goal:null, order:i})); lsSet('ht_habits', hs); }
    state.habits = hs;
    state.loadedHabits = true;
  }
  loadMonth();
}
function setSync(on, text){ const s = $('#sync'); s.classList.toggle('on', on); $('span', s).textContent = text; }
function newId(){ return 'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ---------- derived ---------- */
function monthInfo(){
  const [y,m] = state.ym.split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  const weeks = [];
  for(let s=1; s<=days; s+=7) weeks.push({n:weeks.length+1, from:s, to:Math.min(s+6, days)});
  return {y, m, days, weeks, dow: d => new Date(y, m-1, d).getDay()};
}
function isChecked(hid, d){ const c = state.month.checks[hid]; return !!(c && c[d]); }
function habitGoal(h, days){ return h.goal && h.goal>0 ? Math.min(h.goal, days) : days; }
function dayState(d){
  if(state.ym < TODAY.ym) return 'past';
  if(state.ym > TODAY.ym) return 'future';
  return d < TODAY.d ? 'past' : d === TODAY.d ? 'today' : 'future';
}
function metrics(){
  const mi = monthInfo();
  const hs = state.habits;
  const perHabit = hs.map(h=>{
    const c = state.month.checks[h.id]||{};
    let actual = 0; for(let d=1; d<=mi.days; d++) if(c[d]) actual++;
    const goal = habitGoal(h, mi.days);
    return {h, goal, actual, left: Math.max(0, goal-actual), pct: goal ? actual/goal : 0};
  });
  const daily = [];
  for(let d=1; d<=mi.days; d++){
    let n=0; hs.forEach(h=>{ if(isChecked(h.id,d)) n++; });
    daily.push(hs.length ? n/hs.length : 0);
  }
  const weekly = mi.weeks.map(w=>{
    let sum=0, cnt=0; for(let d=w.from; d<=w.to; d++){ sum+=daily[d-1]; cnt++; }
    return cnt ? sum/cnt : 0;
  });
  const goal = perHabit.reduce((a,x)=>a+x.goal,0);
  const done = perHabit.reduce((a,x)=>a+x.actual,0);
  return {mi, perHabit, daily, weekly, goal, done, left: Math.max(0, goal-done)};
}

/* ---------- render ---------- */
function render(){
  const M = metrics();
  const mi = M.mi;
  $('#monthLabel').textContent = MONTHS[mi.m-1]+' '+mi.y;
  $('#subtitle').textContent = state.habits.length
    ? state.habits.length+' návykov · '+mi.days+' dní · ťukni a odškrtni'
    : 'Denné návyky, jeden mesiac na jednej obrazovke.';

  // stats
  $('#sGoal').textContent = M.goal;
  $('#sDone').textContent = M.done;
  $('#sLeft').textContent = M.left;
  const pct = M.goal ? M.done/M.goal : 0;
  $('#pct').textContent = Math.round(pct*100)+' %';
  const C = 2*Math.PI*48;
  $('#donutArc').setAttribute('stroke-dasharray', (pct*C).toFixed(1)+' '+C.toFixed(1));

  renderBars($('#dailyChart'), M.daily.map((v,i)=>({v, label:String(i+1), tip:(i+1)+'. '+MONTHS[mi.m-1].toLowerCase().slice(0,3)+': '+Math.round(v*100)+' %', cls:dayState(i+1)})), {everyLabel: mi.days>20 ? 5 : 1});
  renderBars($('#weeklyChart'), M.weekly.map((v,i)=>({v, label:'T'+(i+1), tip:'Týždeň '+(i+1)+': '+Math.round(v*100)+' %', cls:''})), {everyLabel:1, wide:true});
  const elapsed = M.daily.filter((_,i)=>dayState(i+1)!=='future');
  const avg = elapsed.length ? elapsed.reduce((a,b)=>a+b,0)/elapsed.length : 0;
  $('#dailyAvg').textContent = elapsed.length ? 'priemer '+Math.round(avg*100)+' %' : '';
  const best = M.weekly.length ? Math.max(...M.weekly) : 0;
  $('#weeklyBest').textContent = best>0 ? 'najlepší '+Math.round(best*100)+' %' : '';

  renderGrid(M);
  renderAnalysis(M);
}

function renderBars(svg, data, opt){
  const W = 600, H = 132, padL = 30, padR = 6, padT = 10, padB = 20;
  const iw = W - padL - padR, ih = H - padT - padB;
  const n = data.length || 1;
  const gap = 2;
  const bw = Math.max(2, (iw - gap*(n-1))/n);
  let s = '';
  [0,0.5,1].forEach(g=>{
    const y = padT + ih - g*ih;
    s += `<line class="grid" x1="${padL}" x2="${W-padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"></line>`;
    s += `<text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end">${Math.round(g*100)}%</text>`;
  });
  data.forEach((d,i)=>{
    const x = padL + i*(bw+gap);
    const h = Math.max(d.v>0 ? 3 : 0, d.v*ih);
    const y = padT + ih - h;
    s += `<rect class="bar ${d.cls}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(4,bw/2).toFixed(1)}" data-tip="${esc(d.tip)}"></rect>`;
    s += `<rect x="${x.toFixed(1)}" y="${padT}" width="${(bw+gap).toFixed(1)}" height="${ih}" fill="transparent" data-tip="${esc(d.tip)}"></rect>`;
    if(i % opt.everyLabel === 0 || i===data.length-1 || opt.wide){
      s += `<text class="${d.cls==='today'?'lbl':''}" x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${d.label}</text>`;
    }
  });
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.innerHTML = s;
}

function renderGrid(M){
  const mi = M.mi, wrap = $('#gridwrap');
  $('#gridInfo').textContent = mi.weeks.length+' týždňov';
  if(!state.loadedHabits){ wrap.innerHTML = '<div class="empty">Načítavam návyky…</div>'; return; }
  let h = '<table class="grid"><thead>';
  h += '<tr><th class="name"></th>';
  mi.weeks.forEach((w,i)=>{ h += `<th class="wk ${i===0?'first':''}" colspan="${w.to-w.from+1}">Týždeň ${w.n}</th>`; });
  h += '</tr><tr><th class="name eyebrow" style="font-size:10px">Návyk</th>';
  for(let d=1; d<=mi.days; d++) h += `<th class="d ${dayState(d)}">${DOW[mi.dow(d)]}</th>`;
  h += '</tr><tr><th class="name"></th>';
  for(let d=1; d<=mi.days; d++) h += `<th class="d num ${dayState(d)}">${d}</th>`;
  h += '</tr></thead><tbody>';
  if(!state.habits.length){
    h += `<tr><td class="name" colspan="${mi.days+1}" style="max-width:none;position:static"><div class="empty"><b>Zatiaľ žiadne návyky</b>Pridaj prvý návyk v poli nižšie.</div></td></tr>`;
  }
  state.habits.forEach(hb=>{
    h += `<tr><td class="name"><button data-edit="${hb.id}" title="Upraviť"><span class="em">${esc(hb.emoji||'·')}</span><span class="t">${esc(hb.name)}</span></button></td>`;
    for(let d=1; d<=mi.days; d++){
      const first = d===1, wk = (d-1)%7===0;
      const on = isChecked(hb.id, d);
      h += `<td class="d ${dayState(d)} ${first?'first':wk?'wk':''}"><button class="chk ${on?'on':''}" data-h="${hb.id}" data-d="${d}" aria-pressed="${on}" aria-label="${esc(hb.name)} ${d}."><i><svg viewBox="0 0 12 12"><path d="M2 6.5 4.8 9 10 3"/></svg></i></button></td>`;
    }
    h += '</tr>';
  });
  if(state.habits.length){
    h += `<tr class="sep"><td class="name"></td><td colspan="${mi.days}"></td></tr>`;
    [['mood','Nálada'],['motivation','Motivácia']].forEach(([k,label])=>{
      h += `<tr class="scale"><td class="name">${label} <span style="font-weight:400;color:var(--ink-3)">1–5</span></td>`;
      for(let d=1; d<=mi.days; d++){
        const v = Number(state.month[k][d]||0);
        const first = d===1, wk = (d-1)%7===0;
        h += `<td class="d ${dayState(d)} ${first?'first':wk?'wk':''}"><button class="v${v}" data-k="${k}" data-d="${d}" aria-label="${label} ${d}.: ${v||'–'}">${v||'·'}</button></td>`;
      }
      h += '</tr>';
    });
  }
  h += `</tbody><tfoot><tr><td colspan="${mi.days+1}"><form class="add-row" id="addForm"><input id="newHabit" placeholder="Nový návyk…" maxlength="60" autocomplete="off"><button class="btn primary" type="submit">Pridať</button></form></td></tr></tfoot></table>`;
  wrap.innerHTML = h;
  // scroll so today's column is visible
  const t = wrap.querySelector('th.d.today');
  if(t && !wrap.dataset.scrolled){ wrap.dataset.scrolled = '1'; const left = t.offsetLeft - 190 - wrap.clientWidth/2 + 60; if(left>0) wrap.scrollLeft = left; }
}

function renderAnalysis(M){
  const an = $('#analysis'), top = $('#top');
  if(!state.habits.length){ an.innerHTML = '<div class="empty">Pridaj návyky a tu uvidíš, ako ti ide každý z nich.</div>'; top.innerHTML = ''; return; }
  let h = '<div class="tablewrap"><table class="an"><thead><tr><th>Návyk</th><th>Cieľ</th><th>Splnené</th><th>Zostáva</th><th style="text-align:left;padding-left:8px">Progres</th></tr></thead><tbody>';
  M.perHabit.forEach(x=>{
    h += `<tr><td>${esc(x.h.emoji)} ${esc(x.h.name)}</td><td class="num">${x.goal}</td><td class="num">${x.actual}</td><td class="num">${x.left}</td><td class="bar"><div class="pbar"><div class="track"><div class="fill" style="width:${(x.pct*100).toFixed(1)}%"></div></div><b class="num">${Math.round(x.pct*100)} %</b></div></td></tr>`;
  });
  h += '</tbody></table></div>';
  an.innerHTML = h;
  const ranked = M.perHabit.slice().sort((a,b)=>b.actual-a.actual || b.pct-a.pct).slice(0,10);
  top.innerHTML = '<ol class="rank">'+ranked.map((x,i)=>`<li><span class="pos num">${i+1}</span><span>${esc(x.h.emoji)} ${esc(x.h.name)}</span><span class="cnt num">${x.actual}× · ${Math.round(x.pct*100)} %</span></li>`).join('')+'</ol>';
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- interactions ---------- */
document.addEventListener('click', e=>{
  const chk = e.target.closest('button.chk');
  if(chk){
    const hid = chk.dataset.h, d = chk.dataset.d;
    const c = Object.assign({}, state.month.checks[hid]||{});
    if(c[d]) delete c[d]; else c[d] = 1;
    state.month = Object.assign({}, state.month, {checks: Object.assign({}, state.month.checks, {[hid]: c})});
    saveMonth(); render(); return;
  }
  const sc = e.target.closest('tr.scale button[data-k]');
  if(sc){
    const k = sc.dataset.k, d = sc.dataset.d;
    const cur = Number(state.month[k][d]||0);
    const nv = (cur+1)%6;
    const m = Object.assign({}, state.month[k]); if(nv) m[d] = nv; else delete m[d];
    state.month = Object.assign({}, state.month, {[k]: m});
    saveMonth(); render(); return;
  }
  const ed = e.target.closest('button[data-edit]');
  if(ed){ openEditor(ed.dataset.edit); return; }
});
document.addEventListener('submit', e=>{
  if(e.target.id==='addForm'){
    e.preventDefault();
    const inp = $('#newHabit'); const name = inp.value.trim(); if(!name) return;
    const emoji = pickEmoji(name);
    const h = {id:newId(), name, emoji, goal:null, order:(state.habits.length ? Math.max(...state.habits.map(x=>x.order))+1 : 0)};
    state.habits = state.habits.concat([h]);
    saveHabit(h); render();
    const i2 = $('#newHabit'); if(i2){ i2.focus(); }
    toast('Návyk pridaný');
  }
});
function pickEmoji(name){
  const n = name.toLowerCase();
  const map = [['gym','🏋️'],['posil','🏋️'],['beh','🏃'],['cvič','💪'],['medit','🧘'],['čít','📖'],['kniha','📖'],['sprch','🚿'],['spán','🌙'],['spať','🌙'],['vod','💧'],['piť','💧'],['uč','🧠'],['štud','🎓'],['práca','💼'],['plán','📝'],['cukor','🍬'],['alko','🍺'],['sociál','📱'],['telef','📱'],['vst','⏰'],['jedl','🥗'],['vitam','💊'],['prech','🚶'],['jog','🧘'],['pís','✍️'],['hudb','🎵'],['jazyk','🗣️']];
  for(const [k,v] of map) if(n.includes(k)) return v;
  return '✅';
}
$('#prev').addEventListener('click', ()=>shiftMonth(-1));
$('#next').addEventListener('click', ()=>shiftMonth(1));
$('#goToday').addEventListener('click', ()=>{ state.ym = TODAY.ym; delete $('#gridwrap').dataset.scrolled; loadMonth(); });
function shiftMonth(n){
  const [y,m] = state.ym.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  state.ym = ymOf(d);
  delete $('#gridwrap').dataset.scrolled;
  loadMonth();
}

/* editor */
function openEditor(id){
  const h = state.habits.find(x=>x.id===id); if(!h) return;
  const root = $('#modalRoot');
  const idx = state.habits.indexOf(h);
  root.innerHTML = `<div class="modal" id="modal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="edT">
    <h3 id="edT">Upraviť návyk</h3>
    <div class="field"><label for="edName">Názov</label><div class="row"><input id="edEmoji" value="${esc(h.emoji)}" maxlength="4" aria-label="Emoji"><input id="edName" value="${esc(h.name)}" maxlength="60"></div></div>
    <div class="field"><label for="edGoal">Cieľ (dní v mesiaci)</label><input id="edGoal" type="number" min="1" max="31" inputmode="numeric" value="${h.goal||''}" placeholder="každý deň"><small>Nechaj prázdne, ak chceš návyk plniť každý deň.</small></div>
    <div class="actions">
      <div style="display:flex;gap:6px">
        <button class="btn ghost" id="edUp" ${idx===0?'disabled':''} title="Posunúť vyššie">↑</button>
        <button class="btn ghost" id="edDown" ${idx===state.habits.length-1?'disabled':''} title="Posunúť nižšie">↓</button>
        <button class="btn danger" id="edDel">Odstrániť</button>
      </div>
      <div class="r"><button class="btn ghost" id="edCancel">Zrušiť</button><button class="btn primary" id="edSave">Uložiť</button></div>
    </div>
  </div></div>`;
  const close = ()=>{ root.innerHTML=''; };
  $('#edCancel').onclick = close;
  $('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') close(); });
  $('#edSave').onclick = ()=>{
    const name = $('#edName').value.trim(); if(!name){ $('#edName').focus(); return; }
    const g = parseInt($('#edGoal').value,10);
    h.name = name; h.emoji = $('#edEmoji').value.trim(); h.goal = (g>0 ? g : null);
    saveHabit(h); render(); close(); toast('Uložené');
  };
  const swap = dir => {
    const j = idx+dir; const o = state.habits[j]; if(!o) return;
    const t = h.order; h.order = o.order; o.order = t;
    if(h.order===o.order){ o.order = h.order + dir; }
    state.habits.sort((a,b)=>a.order-b.order);
    saveHabit(h); saveHabit(o); render(); close(); openEditor(h.id);
  };
  $('#edUp').onclick = ()=>swap(-1);
  $('#edDown').onclick = ()=>swap(1);
  let armed = false;
  $('#edDel').onclick = ()=>{
    if(!armed){ armed = true; $('#edDel').textContent = 'Naozaj odstrániť?'; return; }
    deleteHabit(h.id); render(); close(); toast('Návyk odstránený');
  };
  setTimeout(()=>$('#edName').focus(), 30);
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#modal')) $('#modalRoot').innerHTML=''; });

/* tooltips */
const tip = $('#tip');
function showTip(e){
  const t = e.target.closest && e.target.closest('[data-tip]'); if(!t){ tip.classList.remove('show'); return; }
  tip.textContent = t.dataset.tip; tip.style.left = e.clientX+'px'; tip.style.top = e.clientY+'px'; tip.classList.add('show');
}
document.addEventListener('pointermove', showTip);
document.addEventListener('pointerleave', ()=>tip.classList.remove('show'));
document.addEventListener('pointerdown', e=>{ if(!(e.target.closest && e.target.closest('[data-tip]'))) tip.classList.remove('show'); });

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 1800); }

/* boot */
state.month = emptyMonth();
render();
initStore();
})();
</script>
