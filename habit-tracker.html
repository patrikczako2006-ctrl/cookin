<title>Tréningový denník</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a printed training logbook. Hairline rules instead of cards, a condensed scoreboard masthead,
   mono numerals everywhere digits line up. One accent (cobalt) marks today, targets and the live value. */
:root{
  --bg:#e8e8e4;
  --paper:#f4f4f1;
  --band:#dededa;
  --rule:#c7c7c2;
  --rule-2:#9c9c97;
  --ink:#121314;
  --ink-2:#4a4b4d;
  --ink-3:#86878a;
  --fill:#121314;
  --fill-fg:#f4f4f1;
  --acc:#1f4fd8;
  --acc-ink:#1a44bb;
  --acc-soft:#d6def7;
  --today:#edf0fb;
  --weekend:#e3e3df;
  --bad:#b5452b;
  --font-cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --cell:36px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141516; --paper:#1b1c1e; --band:#232426; --rule:#333436; --rule-2:#5a5b5e;
    --ink:#ecebe6; --ink-2:#b6b5b0; --ink-3:#7e7e7c; --fill:#ecebe6; --fill-fg:#141516;
    --acc:#6b8ff5; --acc-ink:#8aa6f7; --acc-soft:#26304d; --today:#1f2230; --weekend:#1f2022; --bad:#e2795c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141516; --paper:#1b1c1e; --band:#232426; --rule:#333436; --rule-2:#5a5b5e;
  --ink:#ecebe6; --ink-2:#b6b5b0; --ink-3:#7e7e7c; --fill:#ecebe6; --fill-fg:#141516;
  --acc:#6b8ff5; --acc-ink:#8aa6f7; --acc-soft:#26304d; --today:#1f2230; --weekend:#1f2022; --bad:#e2795c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;border-radius:0}
input{font:inherit;color:inherit;border-radius:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.cond{font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.01em}
.lbl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.page{max-width:1180px;margin:0 auto;padding-block:10px 56px;padding-inline:16px}

/* masthead */
.mast{border-top:3px solid var(--ink);padding-top:8px;display:grid;grid-template-columns:1fr auto;gap:8px 20px;align-items:start}
.mast .kicker{display:flex;justify-content:space-between;gap:12px;grid-column:1/-1;border-bottom:1px solid var(--rule);padding-bottom:6px}
.mast .kicker .sync{display:flex;align-items:center;gap:7px}
.mast .kicker .sync i{width:8px;height:8px;background:var(--ink-3);display:inline-block}
.mast .kicker .sync.on i{background:var(--acc)}
.mast h1{margin:0;font-family:var(--font-cond);font-weight:800;text-transform:uppercase;font-size:clamp(56px,13vw,116px);line-height:.86;letter-spacing:-.01em}
.mast h1 small{display:block;font-size:.3em;font-weight:700;letter-spacing:.06em;color:var(--ink-2);margin-top:8px}
.mast .nav{display:flex;align-items:center;gap:0;border:1px solid var(--ink);align-self:end;margin-top:8px}
.mast .nav button{height:40px;min-width:40px;padding-inline:12px;font-family:var(--font-cond);font-weight:700;text-transform:uppercase;font-size:15px;border-right:1px solid var(--ink)}
.mast .nav button:last-child{border-right:0}
.mast .nav button:hover{background:var(--ink);color:var(--fill-fg)}
.mast .nav button.acc{color:var(--acc-ink)}
.mast .nav button.acc:hover{background:var(--acc);color:#fff}
@media (max-width:640px){.mast{grid-template-columns:1fr}.mast .nav{justify-self:start}}

/* ticker */
.ticker{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin-top:14px}
.ticker div{padding:10px 12px 10px 0;border-right:1px solid var(--rule);margin-right:12px}
.ticker div:last-child{border-right:0}
.ticker b{display:block;font-family:var(--font-mono);font-weight:500;font-size:22px;line-height:1.1;margin-top:3px;font-variant-numeric:tabular-nums}
.ticker b sub{font-size:11px;vertical-align:baseline;color:var(--ink-3);margin-left:3px}
.ticker .d{font-size:11px;color:var(--ink-2);font-family:var(--font-mono)}
.ticker .d.up{color:var(--acc-ink)}
.ticker .d.down{color:var(--bad)}

/* sections */
.sec{margin-top:34px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:5px;margin-bottom:12px}
.sec-h h2{margin:0;font-family:var(--font-cond);font-weight:800;text-transform:uppercase;font-size:26px;line-height:1;letter-spacing:.01em}
.sec-h .lbl{text-align:right}

/* today panel */
.today{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0;border:1px solid var(--ink);background:var(--paper)}
@media (max-width:760px){.today{grid-template-columns:1fr}}
.today .col{padding:14px 16px;min-width:0}
.today .col + .col{border-left:1px solid var(--rule)}
@media (max-width:760px){.today .col + .col{border-left:0;border-top:1px solid var(--rule)}}
.today .title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.today .title b{font-family:var(--font-cond);text-transform:uppercase;font-weight:700;font-size:18px}
.tlist{display:grid}
.tlist button{display:grid;grid-template-columns:18px 1fr auto;gap:12px;align-items:center;text-align:left;padding:9px 0;border-bottom:1px solid var(--rule);font-weight:500}
.tlist button:last-child{border-bottom:0}
.tlist button i{width:16px;height:16px;border:1.5px solid var(--rule-2);display:block;position:relative}
.tlist button.on i{background:var(--fill);border-color:var(--fill)}
.tlist button.on i::after{content:"";position:absolute;left:4px;top:1px;width:5px;height:9px;border:solid var(--fill-fg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.tlist button .s{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.tlist button.on .s{color:var(--ink-2)}
.fields{display:grid;gap:0}
.fld{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.fld:last-child{border-bottom:0}
.fld label{font-weight:500}
.fld label small{display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink-3);font-weight:400}
.fld .in{display:flex;align-items:center;gap:6px}
.fld input{width:104px;height:36px;border:1px solid var(--rule-2);background:var(--bg);padding-inline:10px;text-align:right;font-family:var(--font-mono);font-size:15px}
.fld input:focus{border-color:var(--acc)}
.fld .u{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);min-width:28px}
.fld.ok label small{color:var(--acc-ink)}
.cnt{display:flex;border:1px solid var(--rule-2)}
.cnt button{width:36px;height:36px;font-family:var(--font-mono);font-size:16px;border-right:1px solid var(--rule-2)}
.cnt button:last-child{border-right:0}
.cnt button:hover{background:var(--band)}
.cnt .v{width:52px;height:36px;display:grid;place-items:center;font-family:var(--font-mono);font-size:14px;border-right:1px solid var(--rule-2);gap:4px;grid-auto-flow:column}
.cnt .v i{width:9px;height:9px;border:1.5px solid var(--ink-2);display:inline-block;border-radius:50%}
.cnt .v i.on{background:var(--fill);border-color:var(--fill)}
.today .note{font-size:12px;color:var(--ink-3);padding:14px 16px;grid-column:1/-1;border-top:1px solid var(--rule)}
.today .col.wide{grid-column:1/-1;border-top:1px solid var(--rule);border-left:0}
.today textarea{width:100%;min-height:72px;resize:vertical;border:1px solid var(--rule-2);background:var(--bg);padding:10px 12px;font:inherit;color:inherit;line-height:1.45;border-radius:0}
.today textarea:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.today .col.wide .meta{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.g td.d .nv.note i{width:9px;height:9px;background:var(--acc);display:block}
.notes{display:grid}
.notes .n{display:grid;grid-template-columns:78px 1fr;gap:14px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:start}
.notes .n:last-child{border-bottom:0}
.notes .n .dt{font-family:var(--font-cond);font-weight:700;text-transform:uppercase;font-size:18px;line-height:1.1;white-space:nowrap}
.notes .n .dt small{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);text-transform:none;font-weight:400;letter-spacing:.08em;margin-top:2px}
.notes .n p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:65ch}
.notes .n button{text-align:left}
.notes .n button:hover p{text-decoration:underline;text-underline-offset:3px}
.f textarea{min-height:120px;resize:vertical;border:1px solid var(--rule-2);background:var(--bg);padding:10px 12px;font:inherit;color:inherit;line-height:1.45;width:100%;border-radius:0}

/* banner */
.banner{margin-top:14px;border:2px solid var(--bad);background:var(--paper);padding:12px 14px;display:grid;gap:10px}
.banner.info{border-color:var(--acc)}
.banner p{margin:0;max-width:75ch}
.banner p a{color:var(--acc-ink);font-family:var(--font-mono);font-size:12.5px;overflow-wrap:anywhere}
.banner p b{display:block;font-family:var(--font-cond);text-transform:uppercase;font-size:18px;letter-spacing:.02em;margin-bottom:2px}
.banner .row{display:flex;flex-wrap:wrap}
.banner textarea{width:100%;min-height:70px;font-family:var(--font-mono);font-size:11px;border:1px solid var(--rule-2);background:var(--bg);color:var(--ink);padding:8px;border-radius:0}
.mast .kicker .sync.bad{color:var(--bad)}
.mast .kicker .sync.bad i{background:var(--bad)}

/* charts */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0;border:1px solid var(--rule);background:var(--paper)}
.ch{padding:12px 14px 10px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-width:0}
.ch .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.ch .t b{font-family:var(--font-cond);text-transform:uppercase;font-weight:700;font-size:16px}
.ch .t span{font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
.ch svg{width:100%;height:120px;display:block}
.ch svg text{font-family:var(--font-mono);font-size:10px;fill:var(--ink-3)}
.ch svg .g{stroke:var(--rule);stroke-width:1}
.ch svg .bar{fill:var(--ink-2)}
.ch svg .bar.today{fill:var(--acc)}
.ch svg .bar.future{fill:var(--rule)}
.ch svg .bar.hit{fill:var(--ink)}
.ch svg .ln{fill:none;stroke:var(--ink);stroke-width:1.75;stroke-linejoin:round;stroke-linecap:round}
.ch svg .pt{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
.ch svg .pt.last{fill:var(--acc);stroke:var(--acc)}
.ch svg .tg{stroke:var(--acc);stroke-width:1;stroke-dasharray:3 3}
.ch svg .tgl{fill:var(--acc-ink);font-weight:500}
.ch svg .last{fill:var(--ink);font-weight:600;font-size:11px}
.ch svg .hit-area{fill:transparent}
.ch svg rect.bar:hover{opacity:.7}
.ch .none{height:120px;display:grid;place-items:center;font-size:12px;color:var(--ink-3);text-align:center;padding-inline:12px}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--paper);font-family:var(--font-mono);font-size:11px;padding:5px 8px;transform:translate(-50%,calc(-100% - 10px));white-space:nowrap;opacity:0;transition:opacity .1s}
.tip.show{opacity:1}

/* month grid */
.gridbox{border:1px solid var(--ink);background:var(--paper)}
.gridwrap{overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
table.g{border-collapse:separate;border-spacing:0;min-width:max-content;font-size:12.5px}
.g th,.g td{height:var(--cell);padding:0;text-align:center;border-bottom:1px solid var(--rule);white-space:nowrap}
.g thead th{font-weight:500;color:var(--ink-3);font-family:var(--font-mono);font-size:10.5px;background:var(--paper)}
.g thead tr.wk th{height:24px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);font-weight:600;background:var(--band);border-left:1px solid var(--rule-2);text-align:left;padding-left:8px}
.g thead tr.wk th.first{border-left:0}
.g thead tr.wk th.name{background:var(--band)}
.g thead tr.dn th{height:20px}
.g th.d,.g td.d{width:var(--cell);min-width:var(--cell);border-left:1px solid var(--rule)}
.g td.d.wk,.g th.d.wk{border-left:1px solid var(--rule-2)}
.g td.d.first,.g th.d.first{border-left:0}
.g .we{background:var(--weekend)}
.g .today{background:var(--today)}
.g thead tr.dn th.today{color:var(--acc-ink);font-weight:600;box-shadow:inset 0 3px 0 var(--acc)}
.g .future{color:var(--ink-3)}
.g .name{position:sticky;left:0;z-index:2;background:var(--paper);text-align:left;padding-inline:12px;min-width:176px;max-width:230px;border-right:1px solid var(--ink);font-weight:500}
.g .name button{width:100%;height:var(--cell);text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px}
.g .name button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g .name button small{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);flex:none}
.g .name button:hover span{text-decoration:underline;text-underline-offset:3px}
.g tr.band td{height:26px;background:var(--band);border-bottom:1px solid var(--rule-2);border-top:1px solid var(--rule-2)}
.g tr.band .name{background:var(--band);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.ck{width:100%;height:100%;display:grid;place-items:center}
.ck i{width:14px;height:14px;border:1.5px solid var(--rule-2);display:block;position:relative;background:var(--paper)}
.ck:hover i{border-color:var(--ink)}
.ck.on i{background:var(--fill);border-color:var(--fill)}
.ck.on i::after{content:"";position:absolute;left:3.5px;top:0;width:4px;height:8px;border:solid var(--fill-fg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.g td.d .nv{width:100%;height:100%;font-family:var(--font-mono);font-size:10.5px;letter-spacing:-.02em;color:var(--ink);display:grid;place-items:center}
.g td.d .nv.e{color:var(--rule-2)}
.g td.d .nv:hover{background:var(--acc-soft)}
.g td.d .nv.hit{font-weight:600}
.g td.d .nv.miss{color:var(--bad)}
.g td.wide{min-width:0;border-left:1px solid var(--rule-2);text-align:left}
.g td.wide.first{border-left:0}
.g td.wide .nv{width:100%;height:100%;display:flex;align-items:center;justify-content:space-between;padding-inline:10px;font-family:var(--font-mono);font-size:11.5px}
.g td.wide .nv:hover{background:var(--acc-soft)}
.g td.wide .nv .dl{color:var(--ink-3);font-size:10.5px}
.g td.wide .nv.e{color:var(--rule-2)}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border:1.5px solid var(--ink-2);border-radius:50%;display:inline-block}
.dots i.on{background:var(--fill);border-color:var(--fill)}
.g tr.scale .nv{color:var(--ink-3)}
.g tr.scale .nv.v3,.g tr.scale .nv.v4,.g tr.scale .nv.v5{color:var(--ink)}
.g tr.scale .nv.v5{background:var(--acc-soft)}
.g tfoot td{border:0;height:auto}
.addrow{display:flex;gap:0;padding:10px 12px;position:sticky;left:0;max-width:420px}
.addrow input{flex:1;min-width:0;height:38px;border:1px solid var(--rule-2);border-right:0;padding-inline:10px;background:var(--bg)}
.addrow button{height:38px;padding-inline:14px;background:var(--fill);color:var(--fill-fg);font-family:var(--font-cond);text-transform:uppercase;font-weight:700;font-size:15px;letter-spacing:.04em}
.gridnote{padding:8px 12px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--rule);display:flex;gap:16px;flex-wrap:wrap}
.gridnote span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;display:inline-block;border:1px solid var(--rule-2)}
.sw.t{background:var(--today);border-color:var(--acc)}
.sw.w{background:var(--weekend)}
.empty{padding:26px 16px;color:var(--ink-2);text-align:center}
.empty b{display:block;font-family:var(--font-cond);text-transform:uppercase;font-size:20px;color:var(--ink);margin-bottom:4px}

/* analysis */
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px}
.two>div{min-width:0}
@media (max-width:820px){.two{grid-template-columns:1fr}}
@media (max-width:520px){.body-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.sec-h h2{font-size:22px}}
.tw{overflow-x:auto}
table.an{width:100%;min-width:500px;border-collapse:collapse;font-size:13px}
.an th{font-family:var(--font-mono);font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:right;padding:6px 8px;border-bottom:1px solid var(--ink)}
.an th:first-child,.an td:first-child{text-align:left;padding-left:0}
.an td{padding:8px 8px;border-bottom:1px solid var(--rule);text-align:right;font-family:var(--font-mono);font-size:12.5px;white-space:nowrap}
.an td:first-child{font-family:var(--font-sans);font-weight:500;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.an td.p{width:36%;min-width:120px;padding-right:0}
.pb{display:flex;align-items:center;gap:8px}
.pb .tr{flex:1;height:8px;background:var(--band);position:relative}
.pb .fl{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.pb b{min-width:38px;text-align:right;font-weight:500}
.an tr.sub td{color:var(--ink-2)}
.an tr.sub td:first-child{padding-left:14px;font-weight:400;color:var(--ink-2)}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule)}
.rank li:last-child{border-bottom:0}
.rank .pos{font-family:var(--font-cond);font-weight:800;font-size:22px;line-height:1;color:var(--ink-3)}
.rank li:first-child .pos{color:var(--acc-ink)}
.rank .c{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2)}
.body-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px;border-top:1px solid var(--ink)}
.body-stats div{padding:10px 10px 10px 0;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);margin-right:10px}
.body-stats div:last-child{border-right:0}
.body-stats b{display:block;font-family:var(--font-mono);font-weight:500;font-size:18px;margin-top:2px}
.body-stats b sub{font-size:10px;color:var(--ink-3);vertical-align:baseline;margin-left:2px}

/* sheet */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,10,12,.5);display:grid;place-items:end center;padding:0}
@media (min-width:600px){.modal{place-items:center;padding:16px}}
.sheet{width:100%;max-width:420px;background:var(--paper);border:1px solid var(--ink);padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.sheet h3{margin:0;font-family:var(--font-cond);text-transform:uppercase;font-weight:800;font-size:24px;line-height:1}
.sheet h3 small{display:block;font-family:var(--font-mono);text-transform:none;font-weight:400;font-size:11px;color:var(--ink-3);letter-spacing:.08em;margin-top:4px}
.f{display:grid;gap:5px}
.f label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.f input{height:44px;border:1px solid var(--rule-2);background:var(--bg);padding-inline:12px;width:100%}
.f input.big{font-family:var(--font-mono);font-size:24px;text-align:right}

<script>
(function(){
'use strict';
const $ = (s, el=document) => el.querySelector(s);
const MONTHS = ['Január','Február','Marec','Apríl','Máj','Jún','Júl','August','September','Október','November','December'];
const MONTHS_G = ['januára','februára','marca','apríla','mája','júna','júla','augusta','septembra','októbra','novembra','decembra'];
const DOW = ['Ne','Po','Ut','St','Št','Pi','So'];
const DEFAULT_HABITS = ['Gym','Jedálniček zlepšiť','Učiť sa viac ako 30 min','Prečítať 10 strán','Bez alkoholu','Max. 1 h sociálne siete','Plánovanie','Spať pred 23:00'];
const METRICS = [
  {k:'kcal',   label:'Kalórie',     unit:'kcal', step:10,  dec:0, target:'kcalTarget', mode:'max'},
  {k:'kg',     label:'Váha',        unit:'kg',   step:0.1, dec:1},
  {k:'steps',  label:'Kroky',       unit:'',     step:100, dec:0, target:'stepsTarget', mode:'min'},
  {k:'physio', label:'Fyzio cviky', unit:'×',    count:2}
];
const DEFAULT_SETTINGS = {stepsTarget:10000, kcalTarget:null, physioTarget:2};

const pad = n => String(n).padStart(2,'0');
const ymOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1);
const TODAY = {};
function refreshToday(){ const n = new Date(); TODAY.date = n; TODAY.ym = ymOf(n); TODAY.d = n.getDate(); }
refreshToday();

const state = {ym: TODAY.ym, habits: [], month: null, settings: Object.assign({}, DEFAULT_SETTINGS), loaded:false, monthReady:false, mode:'local'};

/* ---------- storage ---------- */
/* Month data is written as small patches with update(), never as a whole-document replace,
   so a device with an older copy can only change the one field the person touched. */
let db = null, unsubMonth = null;
const writers = new Map(), monthQ = new Map();
let inflight = 0;
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }
function has(v){ return v!==undefined && v!==null && v!==''; }
function syncBusy(n){ inflight += n; if(state.mode!=='db') return; if(inflight>0) setSync(true, 'ukladám…'); else if(!syncErr) setSync(true, 'cloud · uložené'); }
let syncErr = false;
function failSave(){ syncErr = true; setSync(false, 'zápis zlyhal'); toast('Neuložilo sa. Skontroluj internet a skús to znova.'); }
async function writeDoc(ref, data){
  let w = writers.get(ref.path);
  if(!w){ w = {busy:false, next:null}; writers.set(ref.path, w); }
  w.next = data;
  if(w.busy) return;
  w.busy = true; syncBusy(1);
  try{ while(w.next){ const d = w.next; w.next = null; try{ await ref.set(d); syncErr = false; }catch(e){ failSave(); } } }
  finally{ w.busy = false; syncBusy(-1); }
}
function deepMerge(a, b){
  const out = Object.assign({}, a);
  for(const k in b){ const bv = b[k], av = a ? a[k] : undefined; out[k] = (bv && typeof bv==='object' && !Array.isArray(bv) && av && typeof av==='object') ? deepMerge(av, bv) : bv; }
  return out;
}
async function sendMonthPatch(ym, p){
  const ref = db.doc('months/'+ym);
  try{ await ref.update(p); return; }
  catch(e){
    if(e && e.code==='unavailable'){ await sleep(500+Math.random()*700); await ref.update(p); return; }
    if(e && e.code==='invalid_argument'){
      const snap = await ref.get();               // update() refuses a missing document: create it only if it really is missing
      if(snap.exists) await ref.update(p); else await ref.set(deepMerge(emptyMonth(), p));
      return;
    }
    throw e;
  }
}
async function patchMonthDoc(ym, patch){
  let q = monthQ.get(ym);
  if(!q){ q = {busy:false, pending:null}; monthQ.set(ym, q); }
  q.pending = q.pending ? deepMerge(q.pending, patch) : patch;
  if(q.busy) return;
  q.busy = true; syncBusy(1);
  try{ while(q.pending){ const p = q.pending; q.pending = null; try{ await sendMonthPatch(ym, p); syncErr = false; }catch(e){ failSave(); } } }
  finally{ q.busy = false; syncBusy(-1); }
}
function lsGet(k, f){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; }catch(e){ return f; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsKeys(prefix){ const out = []; try{ for(let i=0; i<localStorage.length; i++){ const k = localStorage.key(i); if(k && k.indexOf(prefix)===0) out.push(k); } }catch(e){} return out; }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function emptyMonth(){ return {checks:{}, mood:{}, motivation:{}, m:{kcal:{},kg:{},steps:{},physio:{}}, waist:{}, notes:{}}; }
function normMonth(x){ x = x||{}; const m = x.m||{}; return {checks:x.checks||{}, mood:x.mood||{}, motivation:x.motivation||{}, m:{kcal:m.kcal||{}, kg:m.kg||{}, steps:m.steps||{}, physio:m.physio||{}}, waist:x.waist||{}, notes:x.notes||{}}; }

function saveHabit(h){ if(state.mode==='db') writeDoc(db.doc('habits/'+h.id), {name:h.name, goal:h.goal??null, order:h.order}); else lsSet('ht_habits', state.habits); }
function deleteHabit(id){ state.habits = state.habits.filter(h=>h.id!==id); if(state.mode==='db') db.doc('habits/'+id).delete().catch(()=>failSave()); else lsSet('ht_habits', state.habits); }
function saveSettings(){ if(state.mode==='db') writeDoc(db.doc('settings/main'), state.settings); else lsSet('ht_settings', state.settings); }
function applyMonth(patch){
  if(state.mode==='db' && !state.monthReady){ toast('Ešte načítavam tvoje dáta, skús o sekundu.'); return false; }
  state.month = normMonth(deepMerge(state.month, patch));
  if(state.mode==='db') patchMonthDoc(state.ym, patch); else lsSet('ht_month_'+state.ym, state.month);
  render(); return true;
}

function loadMonth(){
  if(unsubMonth){ unsubMonth(); unsubMonth = null; }
  state.monthReady = false;
  if(state.mode==='db'){
    state.month = emptyMonth(); render();
    const ym = state.ym;
    unsubMonth = db.doc('months/'+ym).onSnapshot(s=>{
      if(ym!==state.ym) return;
      if(!s.exists && s.metadata && s.metadata.fromCache) return;   // not the server's answer yet
      state.month = s.exists ? normMonth(s.data()) : emptyMonth();
      const first = !state.monthReady; state.monthReady = true; render();
      if(first) checkLeftovers();
    }, ()=>{ setSync(false, 'spojenie prerušené'); showBanner('bad', '<b>Spojenie s cloudom sa prerušilo</b>Zápisy sa teraz neukladajú. Obnov stránku.', [['Obnoviť', ()=>location.reload()]]); });
  } else { state.month = normMonth(lsGet('ht_month_'+state.ym, null)); state.monthReady = true; render(); }
}
async function initStore(){
  setSync(false, 'pripájam sa ku cloudu…');
  try{ db = (window.claude && window.claude.use) ? await window.claude.use('db') : null; }catch(e){ db = null; }
  if(db){
    state.mode = 'db'; setSync(true, 'cloud · pripojené');
    db.collection('habits').orderBy('order').onSnapshot(s=>{
      if(s.empty && s.metadata && s.metadata.fromCache) return;
      state.habits = s.docs.map(d=>{ const x=d.data()||{}; return {id:d.id, name:x.name||'', goal:(x.goal==null?null:Number(x.goal)), order:Number(x.order)||0}; });
      const first = !state.loaded; state.loaded = true; render();
      if(first) checkLeftovers();
    }, ()=>{ state.loaded = true; render(); });
    db.doc('settings/main').onSnapshot(s=>{ state.settings = Object.assign({}, DEFAULT_SETTINGS, s.exists ? s.data() : {}); render(); }, ()=>{});
  } else {
    state.mode = 'local'; setSync(false, 'nepripojené · len toto zariadenie');
    let hs = lsGet('ht_habits', null);
    if(!hs){ hs = DEFAULT_HABITS.map((n,i)=>({id:newId(), name:n, goal:null, order:i})); lsSet('ht_habits', hs); }
    state.habits = hs; state.settings = Object.assign({}, DEFAULT_SETTINGS, lsGet('ht_settings', {})); state.loaded = true;
    showOffline();
  }
  loadMonth();
}
function setSync(on, t){ const s = $('#sync'); s.classList.toggle('on', on); s.classList.toggle('bad', !on && /zlyhal|nepripojen|preru/.test(t)); $('span', s).textContent = t; }
function newId(){ return 'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ---------- banner, recovery and transfer ---------- */
function showBanner(kind, html, buttons, extra){
  const b = $('#banner');
  if(!kind){ b.hidden = true; b.innerHTML = ''; return; }
  b.className = 'banner '+kind; b.hidden = false;
  b.innerHTML = `<p>${html}</p>${buttons && buttons.length ? '<div class="row">'+buttons.map((x,i)=>`<button class="b ${i===0?'fill':''}" data-bi="${i}">${x[0]}</button>`).join('')+'</div>' : ''}${extra||''}`;
  (buttons||[]).forEach((x,i)=>{ b.querySelector(`[data-bi="${i}"]`).onclick = x[1]; });
}
function localExport(){
  const months = {};
  lsKeys('ht_month_').forEach(k=>{ const v = lsGet(k, null); if(v) months[k.slice(9)] = v; });
  return {v:1, habits: lsGet('ht_habits', []), months};
}
function normName(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim(); }
function countEntries(src){ const p = planImport(src, null); return p.count; }
/* fill-only merge: an entry from the other copy is used only where the cloud has nothing for that day */
function planImport(src, cloudMonths){
  const empty = v => v===undefined || v===null || v==='' || v===0;
  const byName = new Map(state.habits.map(h=>[normName(h.name), h.id]));
  const idMap = {}, newHabits = [];
  let order = state.habits.reduce((a,h)=>Math.max(a, h.order), -1);
  const used = new Set();
  Object.values(src.months||{}).forEach(m=>{ const c = (m && m.checks) || {}; Object.keys(c).forEach(id=>{ if(Object.values(c[id]||{}).some(v=>v)) used.add(id); }); });
  (src.habits||[]).forEach(h=>{
    const key = normName(h.name); if(!key) return;
    let id = byName.get(key);
    if(!id && used.has(h.id)){ id = newId(); order += 1; newHabits.push({id, name:h.name, goal:null, order}); byName.set(key, id); }
    if(id) idMap[h.id] = id;
  });
  const patches = {}; let count = 0;
  Object.keys(src.months||{}).forEach(ym=>{
    if(!/^\d{4}-\d{2}$/.test(ym)) return;
    const loc = normMonth(src.months[ym]);
    const cloud = normMonth(cloudMonths ? cloudMonths[ym] : null);
    const patch = {};
    const put = (path, val)=>{ let o = patch; for(let i=0; i<path.length-1; i++){ o = o[path[i]] = o[path[i]] || {}; } o[path[path.length-1]] = val; count++; };
    Object.keys(loc.checks).forEach(lid=>{ const cid = idMap[lid]; if(!cid) return; Object.keys(loc.checks[lid]||{}).forEach(d=>{ if(loc.checks[lid][d] && !(cloud.checks[cid]||{})[d]) put(['checks',cid,d], 1); }); });
    ['kcal','kg','steps','physio'].forEach(k=>Object.keys(loc.m[k]).forEach(d=>{ const v = loc.m[k][d]; if(!empty(v) && !isNaN(v) && empty(cloud.m[k][d])) put(['m',k,d], Number(v)); }));
    ['mood','motivation'].forEach(k=>Object.keys(loc[k]).forEach(d=>{ const v = loc[k][d]; if(!empty(v) && empty(cloud[k][d])) put([k,d], Number(v)); }));
    Object.keys(loc.notes).forEach(d=>{ const v = loc.notes[d]; if(v && !cloud.notes[d]) put(['notes',d], String(v).slice(0,1000)); });
    Object.keys(loc.waist).forEach(w=>{ const v = loc.waist[w]; if(!empty(v) && !isNaN(v) && empty(cloud.waist[w])) put(['waist',w], Number(v)); });
    if(Object.keys(patch).length) patches[ym] = patch;
  });
  return {patches, newHabits, count};
}
async function runImport(src){
  const cloudMonths = {};
  for(const ym of Object.keys(src.months||{})){ if(!/^\d{4}-\d{2}$/.test(ym)) continue; const sn = await db.doc('months/'+ym).get(); cloudMonths[ym] = sn.exists ? sn.data() : null; }
  const plan = planImport(src, cloudMonths);
  for(const h of plan.newHabits){ await db.doc('habits/'+h.id).set({name:h.name, goal:null, order:h.order}); }
  for(const ym of Object.keys(plan.patches)){ await sendMonthPatch(ym, plan.patches[ym]); }
  return plan.count;
}
function checkLeftovers(){
  if(state.mode!=='db' || !state.loaded || !state.monthReady || checkLeftovers.done) return;
  checkLeftovers.done = true;
  const src = localExport();
  const n = countEntries(src);
  if(!n) return;
  showBanner('info', `<b>Na tomto zariadení je ${n} ${n===1?'zápis':n<5?'zápisy':'zápisov'} mimo cloudu</b>Vznikli, keď stránka nebola pripojená. Nahratím ich doplníš do denníka. Nič existujúce sa neprepíše.`, [
    ['Nahrať do cloudu', async ()=>{ try{ const c = await runImport(src); lsKeys('ht_month_').forEach(lsDel); lsDel('ht_habits'); showBanner(null); toast('Nahraté: '+c+' zápisov'); }catch(e){ toast('Nahratie zlyhalo. Skús to znova.'); } }],
    ['Teraz nie', ()=>showBanner(null)]
  ]);
}
function showOffline(){
  const src = localExport(), n = countEntries(src);
  showBanner('bad', `<b>Nie si pripojený ku cloudu</b>Táto kópia nevidí tvoje uložené dáta a ukazuje prázdny denník. Čo sem zapíšeš, ostane len tu. Tvoje dáta nájdeš na odkaze <a href="https://claude.ai/artifact/15aFwYGbCaRM174fdGrCMp" target="_blank" rel="noopener">claude.ai/artifact/15aFwYGbCaRM174fdGrCMp</a>, keď si prihlásený.${n? ' Na tomto zariadení je '+n+' zápisov, ktoré môžeš preniesť: skopíruj kód a vlož ho v pripojenom denníku cez Ciele.' : ''}`,
    [['Skúsiť znova', ()=>location.reload()]].concat(n ? [['Skopírovať zápisy', ()=>copyTransfer(src)]] : []),
    n ? '<textarea id="xfer" readonly hidden aria-label="Kód prenosu"></textarea>' : '');
}
function copyTransfer(src){
  const code = 'DENNIK1:'+JSON.stringify(src);
  const ta = $('#xfer'); if(ta){ ta.hidden = false; ta.value = code; }
  const fallback = ()=>{ if(ta){ ta.focus(); ta.select(); } toast('Označ text v poli a skopíruj ho.'); };
  try{ navigator.clipboard.writeText(code).then(()=>toast('Kód skopírovaný'), fallback); }catch(e){ fallback(); }
}

/* ---------- helpers ---------- */
function monthInfo(ym){
  const [y,m] = ym.split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  const weeks = []; for(let s=1; s<=days; s+=7) weeks.push({n:weeks.length+1, from:s, to:Math.min(s+6,days)});
  return {y, m, days, weeks, dow:d=>new Date(y,m-1,d).getDay()};
}
function weekOf(d){ return Math.floor((d-1)/7)+1; }
function dayState(d, ym=state.ym){ if(ym<TODAY.ym) return 'past'; if(ym>TODAY.ym) return 'future'; return d<TODAY.d?'past':d===TODAY.d?'today':'future'; }
function isChecked(hid, d){ const c = state.month.checks[hid]; return !!(c && c[d]); }
function metricVal(k, d){ const v = state.month.m[k][d]; return (v===undefined||v===null||v==='') ? null : Number(v); }
function targetFor(mt){ return mt.target ? (state.settings[mt.target] || null) : null; }
function metricHit(mt, d){
  const v = metricVal(mt.k, d); if(v===null) return null;
  if(mt.count) return v>=mt.count;
  const t = targetFor(mt); if(!t) return null;
  return mt.mode==='min' ? v>=t : v<=t;
}
function fmt(v, dec=0){ if(v===null||v===undefined||isNaN(v)) return '–'; return Number(v).toLocaleString('sk-SK',{minimumFractionDigits:dec, maximumFractionDigits:dec}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* items that count toward the daily score: habits + physio + steps (+ kcal when a target is set) */
function scoreItems(){
  const items = state.habits.map(h=>({type:'habit', id:h.id, name:h.name, goal:h.goal}));
  items.push({type:'metric', id:'physio', name:'Fyzio cviky 2×', mt:METRICS[3]});
  items.push({type:'metric', id:'steps', name:fmt(state.settings.stepsTarget)+' krokov', mt:METRICS[2]});
  if(state.settings.kcalTarget) items.push({type:'metric', id:'kcal', name:'Kalórie do '+fmt(state.settings.kcalTarget), mt:METRICS[0]});
  return items;
}
function itemDone(it, d){ return it.type==='habit' ? isChecked(it.id, d) : !!metricHit(it.mt, d); }

function metrics(){
  const mi = monthInfo(state.ym);
  const items = scoreItems();
  const per = items.map(it=>{
    let actual=0; for(let d=1; d<=mi.days; d++) if(itemDone(it,d)) actual++;
    const goal = it.type==='habit' && it.goal>0 ? Math.min(it.goal, mi.days) : mi.days;
    return {it, goal, actual, left:Math.max(0,goal-actual), pct: goal?actual/goal:0};
  });
  const daily=[]; for(let d=1; d<=mi.days; d++){ let n=0; items.forEach(it=>{ if(itemDone(it,d)) n++; }); daily.push(items.length? n/items.length : 0); }
  const weekly = mi.weeks.map(w=>{ let s=0,c=0; for(let d=w.from; d<=w.to; d++){ s+=daily[d-1]; c++; } return c? s/c : 0; });
  const goal = per.reduce((a,x)=>a+x.goal,0), done = per.reduce((a,x)=>a+x.actual,0);
  const series = {}; METRICS.forEach(mt=>{ series[mt.k] = []; for(let d=1; d<=mi.days; d++) series[mt.k].push(metricVal(mt.k,d)); });
  const waist = mi.weeks.map(w=>{ const v = state.month.waist[w.n]; return (v===undefined||v===null||v==='')?null:Number(v); });
  return {mi, items, per, daily, weekly, goal, done, left:Math.max(0,goal-done), series, waist};
}
function seriesStats(arr){
  const vals = arr.map((v,i)=>({v,i})).filter(x=>x.v!==null && !isNaN(x.v));
  if(!vals.length) return null;
  const first = vals[0], last = vals[vals.length-1];
  const avg = vals.reduce((a,x)=>a+x.v,0)/vals.length;
  return {first, last, avg, min:Math.min(...vals.map(x=>x.v)), max:Math.max(...vals.map(x=>x.v)), n:vals.length, delta:last.v-first.v};
}

/* ---------- render ---------- */
function render(){
  const M = metrics(), mi = M.mi;
  $('#mh').firstChild.textContent = MONTHS[mi.m-1];
  $('#mhs').textContent = mi.y + ' · ' + mi.days + ' dní · ' + M.items.length + ' položiek denne';
  renderTicker(M);
  renderToday(M);
  renderCharts(M);
  renderGrid(M);
  renderAnalysis(M);
  renderNotes(M);
}

function renderTicker(M){
  const el = $('#ticker');
  const elapsed = M.daily.filter((_,i)=>dayState(i+1)!=='future');
  const avg = elapsed.length ? elapsed.reduce((a,b)=>a+b,0)/elapsed.length : 0;
  const kg = seriesStats(M.series.kg), st = seriesStats(M.series.steps), kc = seriesStats(M.series.kcal), wa = seriesStats(M.waist);
  const delta = (s, dec, unit) => s && s.n>1 ? `<span class="d ${s.delta<0?'down':s.delta>0?'up':''}">${s.delta>0?'+':''}${fmt(s.delta,dec)} ${unit} od začiatku</span>` : `<span class="d">${s? 'jeden záznam':'bez záznamu'}</span>`;
  el.innerHTML = `
    <div><span class="lbl">Splnené</span><b>${M.done}<sub>/ ${M.goal}</sub></b><span class="d">${Math.round((M.goal?M.done/M.goal:0)*100)} % mesiaca · priemer dňa ${Math.round(avg*100)} %</span></div>
    <div><span class="lbl">Váha</span><b>${kg?fmt(kg.last.v,1):'–'}<sub>kg</sub></b>${delta(kg,1,'kg')}</div>
    <div><span class="lbl">Pás</span><b>${wa?fmt(wa.last.v,1):'–'}<sub>cm</sub></b>${delta(wa,1,'cm')}</div>
    <div><span class="lbl">Kroky · priemer</span><b>${st?fmt(st.avg):'–'}</b><span class="d">${st? M.series.steps.filter(v=>v!==null && v>=state.settings.stepsTarget).length+' dní nad '+fmt(state.settings.stepsTarget) : 'bez záznamu'}</span></div>
    <div><span class="lbl">Kalórie · priemer</span><b>${kc?fmt(kc.avg):'–'}<sub>kcal</sub></b><span class="d">${state.settings.kcalTarget ? 'cieľ do '+fmt(state.settings.kcalTarget) : 'cieľ nenastavený'}</span></div>`;
}

  });

  h += fld('kcal','Kalórie', kcalT? (v('kcal')!==null ? (v('kcal')<=kcalT? 'v rámci cieľa':'nad cieľ o '+fmt(v('kcal')-kcalT)) : 'cieľ do '+fmt(kcalT)) : 'cieľ nastavíš cez „Ciele“', v('kcal'), 'kcal', 0, hitCls(METRICS[0]));
  const kgS = seriesStats(M.series.kg);
  h += fld('kg','Váha', kgS && kgS.n>1 ? (kgS.delta>0?'+':'')+fmt(kgS.delta,1)+' kg tento mesiac' : 'denne ráno, rovnaká váha', v('kg'), 'kg', 1, '');
  h += fld('steps','Kroky', v('steps')!==null ? (v('steps')>=stT ? 'cieľ splnený' : 'chýba '+fmt(stT-v('steps'))) : 'cieľ '+fmt(stT), v('steps'), '', 0, hitCls(METRICS[2]));

  h += `<div class="fld"><label>Obvod pása<small>${wv? 'týždeň '+wk+' zapísaný' : 'raz týždenne · týždeň '+wk+' ('+wkStart+'.–'+wkEnd+'.)'}</small></label><div class="in"><input id="in-waist" inputmode="decimal" step="0.1" type="number" value="${wv??''}" placeholder="–" data-waist="${wk}"><span class="u">cm</span></div></div>`;

  box.innerHTML = h;
  function fld(k,label,sub,val,unit,dec,cls){ return `<div class="fld ${cls}"><label>${label}<small>${sub}</small></label><div class="in"><input id="in-${k}" type="number" inputmode="decimal" step="${k==='kg'?'0.1':'1'}" value="${val===null?'':val}" placeholder="–" data-m="${k}" data-d="${d}"><span class="u">${unit}</span></div></div>`; }

function renderCharts(M){
  const mi = M.mi, el = $('#charts');
  const today = state.ym===TODAY.ym ? TODAY.d : null;
  const labelsEvery = mi.days>20 ? 5 : 1;
  const kg = seriesStats(M.series.kg), st = seriesStats(M.series.steps), kc = seriesStats(M.series.kcal);

  let h = '';
  h += chartBox('Plnenie dňa', '% položiek', barChart(M.daily.map((v,i)=>({v:v*100, cls:dayState(i+1), tip:(i+1)+'. · '+Math.round(v*100)+' %'})), {max:100, labelsEvery, fmt:v=>Math.round(v)+'%'}));
  h += chartBox('Váha', kg? fmt(kg.min,1)+' – '+fmt(kg.max,1)+' kg' : 'bez záznamu', kg ? lineChart(M.series.kg, {labelsEvery, dec:1, unit:'kg', padPct:.25}) : none('Zapíš váhu v paneli Dnes a tu sa vykreslí krivka.'));
  h += chartBox('Kroky', st ? 'priemer '+fmt(st.avg) : 'bez záznamu', st ? barChart(M.series.steps.map((v,i)=>({v:v, cls:(v!==null&&v>=state.settings.stepsTarget?'hit ':'')+dayState(i+1), tip:(i+1)+'. · '+fmt(v)})), {target:state.settings.stepsTarget, targetLabel:fmt(state.settings.stepsTarget), labelsEvery, fmt:v=>fmt(v/1000,0)+'k'}) : none('Kroky za deň zapíš v paneli Dnes.'));
  h += chartBox('Kalórie', kc ? 'priemer '+fmt(kc.avg)+' kcal' : 'bez záznamu', kc ? barChart(M.series.kcal.map((v,i)=>({v:v, cls:(state.settings.kcalTarget&&v!==null&&v<=state.settings.kcalTarget?'hit ':'')+dayState(i+1), tip:(i+1)+'. · '+fmt(v)+' kcal'})), {target:state.settings.kcalTarget, targetLabel:state.settings.kcalTarget?fmt(state.settings.kcalTarget):'', labelsEvery, fmt:v=>fmt(v)}) : none('Kalórie za deň zapíš v paneli Dnes.'));
  h += chartBox('Týždne', 'priemer týždňa', barChart(M.weekly.map((v,i)=>({v:v*100, cls:'', tip:'Týždeň '+(i+1)+' · '+Math.round(v*100)+' %'})), {max:100, labelsEvery:1, labels:M.weekly.map((_,i)=>'T'+(i+1)), fmt:v=>Math.round(v)+'%'}));
  const wa = seriesStats(M.waist);
  h += chartBox('Pás · týždenne', wa ? fmt(wa.first.v,1)+' → '+fmt(wa.last.v,1)+' cm' : 'bez záznamu', wa ? lineChart(M.waist, {labelsEvery:1, labels:M.waist.map((_,i)=>'T'+(i+1)), dec:1, unit:'cm', padPct:.3}) : none('Obvod pása meraj raz týždenne, zapíš v paneli Dnes.'));
  el.innerHTML = h;
  function chartBox(t, s, inner){ return `<div class="ch"><div class="t"><b>${t}</b><span>${s}</span></div>${inner}</div>`; }
  function none(t){ return `<div class="none">${t}</div>`; }
}
function barChart(data, o){
  const W=320, H=120, pl=34, pr=6, pt=8, pb=18, iw=W-pl-pr, ih=H-pt-pb;
  const vals = data.map(d=>d.v).filter(v=>v!==null && !isNaN(v));
  let max = o.max || Math.max(o.target||0, ...vals, 1);
  if(!o.max){ max = niceMax(max); }
  const n = data.length||1, gap=2, bw=Math.max(2,(iw-gap*(n-1))/n);
  let s = '';
  [0,.5,1].forEach(g=>{ const y = pt+ih-g*ih; s += `<line class="g" x1="${pl}" x2="${W-pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${pl-5}" y="${(y+3).toFixed(1)}" text-anchor="end">${o.fmt(g*max)}</text>`; });
  data.forEach((d,i)=>{
    const x = pl+i*(bw+gap);
    if(d.v!==null && !isNaN(d.v)){ const hh = Math.max(d.v>0?2:0, d.v/max*ih); s += `<rect class="bar ${d.cls}" x="${x.toFixed(1)}" y="${(pt+ih-hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" data-tip="${esc(d.tip)}"/>`; }
    const lab = o.labels ? o.labels[i] : String(i+1);
    if(o.labels || i%o.labelsEvery===0 || i===n-1) s += `<text x="${(x+bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${lab}</text>`;
  });
  if(o.target){ const y = pt+ih-o.target/max*ih; s += `<line class="tg" x1="${pl}" x2="${W-pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text class="tgl" x="${W-pr}" y="${(y-3).toFixed(1)}" text-anchor="end">${o.targetLabel}</text>`; }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">${s}</svg>`;
}
function lineChart(arr, o){
  const W=320, H=120, pl=36, pr=30, pt=10, pb=18, iw=W-pl-pr, ih=H-pt-pb;
  const pts = arr.map((v,i)=>({v,i})).filter(p=>p.v!==null && !isNaN(p.v));
  let lo = Math.min(...pts.map(p=>p.v)), hi = Math.max(...pts.map(p=>p.v));
  const span = Math.max(hi-lo, 0.5); lo -= span*o.padPct; hi += span*o.padPct;
  const n = arr.length;
  const X = i => n>1 ? pl + i/(n-1)*iw : pl+iw/2, Y = v => pt + ih - (v-lo)/(hi-lo)*ih;
  let s='';
  [lo, (lo+hi)/2, hi].forEach(v=>{ const y=Y(v); s += `<line class="g" x1="${pl}" x2="${W-pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${pl-5}" y="${(y+3).toFixed(1)}" text-anchor="end">${fmt(v,o.dec)}</text>`; });
  for(let i=0;i<n;i++){ const lab = o.labels? o.labels[i] : String(i+1); if(o.labels || i%o.labelsEvery===0 || i===n-1) s += `<text x="${X(i).toFixed(1)}" y="${H-5}" text-anchor="middle">${lab}</text>`; }
  s += `<path class="ln" d="${pts.map((p,k)=>(k?'L':'M')+X(p.i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ')}"/>`;
  pts.forEach((p,k)=>{ const last = k===pts.length-1; s += `<circle class="pt ${last?'last':''}" cx="${X(p.i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${last?3.5:2.5}" data-tip="${(o.labels?o.labels[p.i]:(p.i+1)+'.')+' · '+fmt(p.v,o.dec)+' '+o.unit}"/>`; if(last) s += `<text class="last" x="${(X(p.i)+6).toFixed(1)}" y="${(Y(p.v)+4).toFixed(1)}">${fmt(p.v,o.dec)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">${s}</svg>`;
}
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); const r = v/p; const m = r<=1?1:r<=2?2:r<=2.5?2.5:r<=5?5:10; return m*p; }

      else { const hit = metricHit(mt,d); const txt = v===null?'·':(mt.k==='steps'? (v>=1000? (v/1000).toFixed(1).replace('.0','')+'k' : String(Math.round(v))) : mt.k==='kcal' ? String(Math.round(v)) : Number(v).toFixed(mt.dec).replace('.',',')); h += `<td class="d ${cls(d)}"><button class="nv ${v===null?'e':''} ${hit===true?'hit':hit===false?'miss':''}" data-m="${mt.k}" data-d="${d}" aria-label="${mt.label} ${d}.: ${v===null?'–':fmt(v,mt.dec)}">${txt}</button></td>`; }
    }

  });
  h += `<tr><td class="name"><span style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>Obvod pása</span><small class="mono" style="font-size:10px;color:var(--ink-3)">cm · týždenne</small></span></td>`;
  mi.weeks.forEach((w,i)=>{ const v = state.month.waist[w.n]; const prev = i>0 ? state.month.waist[w.n-1] : undefined; const dl = (has(v)&&has(prev)) ? (Number(v)-Number(prev)) : null; h += `<td class="wide ${i===0?'first':''}" colspan="${w.to-w.from+1}"><button class="nv ${has(v)?'':'e'}" data-waist="${w.n}"><span>${has(v)?fmt(Number(v),1)+' cm':'· zapíš'}</span>${dl!==null? `<span class="dl">${dl>0?'+':''}${fmt(dl,1)}</span>`:''}</button></td>`; });
  h += '</tr>';
  h += band('Stav');
  [['mood','Nálada'],['motivation','Motivácia']].forEach(([k,label])=>{
    h += `<tr class="scale"><td class="name"><span style="display:flex;justify-content:space-between;gap:8px"><span>${label}</span><small class="mono" style="font-size:10px;color:var(--ink-3)">1–5</small></span></td>`;
    for(let d=1; d<=mi.days; d++){ const v = Number(state.month[k][d]||0); h += `<td class="d ${cls(d)}"><button class="nv v${v} ${v?'':'e'}" data-k="${k}" data-d="${d}" aria-label="${label} ${d}.: ${v||'–'}">${v||'·'}</button></td>`; }

function renderAnalysis(M){
  const an = $('#analysis'), rk = $('#rank'), bs = $('#bodyStats');
  if(!M.items.length){ an.innerHTML=''; rk.innerHTML=''; bs.innerHTML=''; return; }
  let h = '<table class="an"><thead><tr><th>Položka</th><th>Cieľ</th><th>Splnené</th><th>Zostáva</th><th style="text-align:left;padding-left:8px">Plnenie</th></tr></thead><tbody>';
  M.per.forEach(x=>{ h += `<tr><td>${esc(x.it.name)}</td><td>${x.goal}</td><td>${x.actual}</td><td>${x.left}</td><td class="p"><div class="pb"><div class="tr"><div class="fl" style="width:${(x.pct*100).toFixed(1)}%"></div></div><b>${Math.round(x.pct*100)} %</b></div></td></tr>`; });
  h += `<tr class="sub"><td>Spolu</td><td>${M.goal}</td><td>${M.done}</td><td>${M.left}</td><td class="p"><div class="pb"><div class="tr"><div class="fl" style="width:${((M.goal?M.done/M.goal:0)*100).toFixed(1)}%"></div></div><b>${Math.round((M.goal?M.done/M.goal:0)*100)} %</b></div></td></tr>`;
  h += '</tbody></table>';
  an.innerHTML = h;
  const ranked = M.per.slice().sort((a,b)=>b.pct-a.pct || b.actual-a.actual);
  rk.innerHTML = '<ol class="rank">'+ranked.map((x,i)=>`<li><span class="pos">${pad(i+1)}</span><span>${esc(x.it.name)}</span><span class="c">${x.actual}× · ${Math.round(x.pct*100)} %</span></li>`).join('')+'</ol>';
  const kg = seriesStats(M.series.kg), wa = seriesStats(M.waist), st = seriesStats(M.series.steps), kc = seriesStats(M.series.kcal);
  const ph = M.series.physio.filter(v=>v!==null&&v>=2).length;
  bs.innerHTML = `
    <div><span class="lbl">Váha · zmena</span><b>${kg&&kg.n>1? (kg.delta>0?'+':'')+fmt(kg.delta,1):'–'}<sub>kg</sub></b></div>
    <div><span class="lbl">Váha · min / max</span><b>${kg? fmt(kg.min,1)+' / '+fmt(kg.max,1):'–'}</b></div>
    <div><span class="lbl">Pás · zmena</span><b>${wa&&wa.n>1? (wa.delta>0?'+':'')+fmt(wa.delta,1):'–'}<sub>cm</sub></b></div>
    <div><span class="lbl">Kroky · spolu</span><b>${st? fmt(st.avg*st.n):'–'}</b></div>
    <div><span class="lbl">Fyzio · 2× splnené</span><b>${ph}<sub>dní</sub></b></div>
    <div><span class="lbl">Kalórie · priemer</span><b>${kc? fmt(kc.avg):'–'}<sub>kcal</sub></b></div>`;
}

/* ---------- writes ---------- */
const numOrNull = v => (v===null || v==='' || v===undefined || isNaN(v)) ? null : Number(v);
function setCheck(hid, d, on){ applyMonth({checks:{[hid]:{[d]: on?1:0}}}); }
function setMetric(k, d, val){ applyMonth({m:{[k]:{[d]: numOrNull(val)}}}); }
function setWaist(wk, val){ applyMonth({waist:{[wk]: numOrNull(val)}}); }
function setNote(d, text){ applyMonth({notes:{[d]: (text||'').trim().slice(0,1000)}}); }
function setScale(k, d, v){ applyMonth({[k]:{[d]: v||0}}); }

/* ---------- interactions ---------- */
document.addEventListener('click', e=>{
  const t = e.target;
  const ck = t.closest('button.ck, .tlist button[data-h]');
  if(ck){ setCheck(ck.dataset.h, ck.dataset.d, !isChecked(ck.dataset.h, ck.dataset.d)); return; }
  const cnt = t.closest('button[data-cnt]');
  if(cnt){ const d = TODAY.d; const cur = metricVal('physio', d)||0; const nv = Math.max(0, Math.min(2, cur+Number(cnt.dataset.cnt))); if(nv!==cur) setMetric('physio', d, nv); return; }
  const cntd = t.closest('button[data-cnt-d]');
  if(cntd){ const d = cntd.dataset.cntD; const cur = metricVal('physio', d)||0; setMetric('physio', d, (cur+1)%3); return; }
  const sc = t.closest('tr.scale button[data-k]');
  if(sc){ const cur = Number(state.month[sc.dataset.k][sc.dataset.d]||0); setScale(sc.dataset.k, sc.dataset.d, (cur+1)%6); return; }
  const nv = t.closest('.g button.nv[data-m]');
  if(nv){ const mt = METRICS.find(m=>m.k===nv.dataset.m); openNumber({title:mt.label, sub:nv.dataset.d+'. '+MONTHS_G[monthInfo(state.ym).m-1], unit:mt.unit, step:mt.step, value:metricVal(mt.k, nv.dataset.d), onSave:v=>setMetric(mt.k, nv.dataset.d, v)}); return; }
  const wb = t.closest('.g button.nv[data-waist]');
  if(wb){ const wk = wb.dataset.waist; const cur = state.month.waist[wk]; openNumber({title:'Obvod pása', sub:'týždeň '+wk, unit:'cm', step:0.1, value:has(cur)?Number(cur):null, onSave:v=>setWaist(wk, v)}); return; }
  const nb = t.closest('button[data-note-d]');
  if(nb){ openNote(Number(nb.dataset.noteD)); return; }
  const ed = t.closest('button[data-edit]');
  if(ed){ openEditor(ed.dataset.edit); return; }
  const tg = t.closest('button[data-target]');
  if(tg){ openSettings(); return; }
});
document.addEventListener('change', e=>{
  const i = e.target;
  if(i.matches('input[data-m]')){ setMetric(i.dataset.m, i.dataset.d, i.value===''?null:Number(i.value)); return; }
  if(i.matches('input[data-waist]')){ setWaist(i.dataset.waist, i.value===''?null:Number(i.value)); return; }
  if(i.matches('textarea[data-note]')){ if((state.month.notes[i.dataset.note]||'')!==i.value.trim()) setNote(i.dataset.note, i.value); return; }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.matches && e.target.matches('.fld input')){ e.target.blur(); }
  if(e.key==='Escape' && $('#modal')) $('#modalRoot').innerHTML='';
});
document.addEventListener('submit', e=>{
  if(e.target.id==='addForm'){
    e.preventDefault();
    const inp = $('#newHabit'); const name = inp.value.trim(); if(!name) return;
    const h = {id:newId(), name, goal:null, order:(state.habits.length? Math.max(...state.habits.map(x=>x.order))+1 : 0)};
    state.habits = state.habits.concat([h]); saveHabit(h); render(); toast('Návyk pridaný');
    const i2 = $('#newHabit'); if(i2) i2.focus();
  }
});
$('#prev').onclick = ()=>shiftMonth(-1);
$('#next').onclick = ()=>shiftMonth(1);
$('#goToday').onclick = ()=>{ state.ym = TODAY.ym; delete $('#gridwrap').dataset.scrolled; loadMonth(); };
$('#settings').onclick = openSettings;
function shiftMonth(n){ const [y,m] = state.ym.split('-').map(Number); state.ym = ymOf(new Date(y, m-1+n, 1)); delete $('#gridwrap').dataset.scrolled; loadMonth(); }

/* sheets */
function sheet(html){ const root = $('#modalRoot'); root.innerHTML = `<div class="modal" id="modal"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; $('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') root.innerHTML=''; }); return ()=>{ root.innerHTML=''; }; }
function openNumber(o){
  const close = sheet(`<h3>${esc(o.title)}<small>${esc(o.sub)}</small></h3>
    <div class="f"><label for="numIn">Hodnota${o.unit? ' · '+esc(o.unit):''}</label><input id="numIn" class="big" type="number" inputmode="decimal" step="${o.step}" value="${o.value===null?'':o.value}" placeholder="–"></div>
    <div class="acts"><button class="b bad" id="numClear">Vymazať</button><div class="r"><button class="b" id="numCancel">Zrušiť</button><button class="b fill" id="numSave">Uložiť</button></div></div>`);
  $('#numCancel').onclick = close;
  $('#numClear').onclick = ()=>{ o.onSave(null); close(); };
  const save = ()=>{ const v = $('#numIn').value; o.onSave(v===''?null:Number(v)); close(); };
  $('#numSave').onclick = save;
  $('#numIn').addEventListener('keydown', e=>{ if(e.key==='Enter') save(); });
  setTimeout(()=>{ const i=$('#numIn'); if(i){ i.focus(); i.select(); } }, 30);
}
function openNote(d){
  const mi = monthInfo(state.ym); const cur = state.month.notes[d]||'';
  const close = sheet(`<h3>Poznámka<small>${DOW[mi.dow(d)]} ${d}. ${MONTHS_G[mi.m-1]} ${mi.y}</small></h3>
    <div class="f"><label for="noteIn">Text</label><textarea id="noteIn" maxlength="1000" placeholder="Ako sa ti darilo, čo zmeniť…">${esc(cur)}</textarea></div>
    <div class="acts"><button class="b bad" id="noteClear" ${cur?'':'disabled'}>Vymazať</button><div class="r"><button class="b" id="noteCancel">Zrušiť</button><button class="b fill" id="noteSave">Uložiť</button></div></div>`);
  $('#noteCancel').onclick = close;
  $('#noteClear').onclick = ()=>{ setNote(d, ''); close(); };
  $('#noteSave').onclick = ()=>{ setNote(d, $('#noteIn').value); close(); toast('Poznámka uložená'); };
  setTimeout(()=>{ const i=$('#noteIn'); if(i) i.focus(); }, 30);
}
function renderNotes(M){
  const el = $('#notes'), mi = M.mi;
  const days = Object.keys(state.month.notes).map(Number).filter(d=>state.month.notes[d]).sort((a,b)=>b-a);
  $('#notesSub').textContent = days.length ? days.length+' z '+mi.days+' dní' : '';
  if(!days.length){ el.innerHTML = '<div class="empty"><b>Zatiaľ bez poznámok</b>Každý deň si môžeš napísať pár slov v paneli Dnes alebo ťuknutím na riadok Poznámka v mriežke.</div>'; return; }
  el.innerHTML = days.map(d=>`<div class="n"><div class="dt">${d}. ${MONTHS_G[mi.m-1].slice(0,3)}<small>${DOW[mi.dow(d)]}</small></div><button data-note-d="${d}" aria-label="Upraviť poznámku ${d}."><p>${esc(state.month.notes[d])}</p></button></div>`).join('');
}
function openSettings(){
  const s = state.settings;
  const close = sheet(`<h3>Ciele<small>platia pre všetky mesiace</small></h3>
    <div class="f"><label for="stSteps">Kroky za deň</label><input id="stSteps" type="number" inputmode="numeric" step="500" value="${s.stepsTarget||''}"><small>Deň sa počíta ako splnený, keď dosiahneš tento počet.</small></div>
    <div class="f"><label for="stKcal">Kalórie za deň · strop</label><input id="stKcal" type="number" inputmode="numeric" step="50" value="${s.kcalTarget||''}" placeholder="bez cieľa"><small>Ak nastavíš, kalórie sa pridajú medzi denné položky a deň je splnený pod stropom.</small></div>
    ${state.mode==='db' ? '<div class="f"><label for="stImport">Preniesť zápisy z iného zariadenia</label><textarea id="stImport" placeholder="Vlož kód, ktorý začína DENNIK1:"></textarea><small>Kód dostaneš na zariadení, kde stránka nebola pripojená, tlačidlom Skopírovať zápisy. Doplnia sa len prázdne políčka.</small><div><button class="b" id="stImportBtn" type="button">Nahrať zápisy</button></div></div>' : ''}
    <div class="acts"><div class="r"><button class="b" id="stCancel">Zrušiť</button><button class="b fill" id="stSave">Uložiť</button></div></div>`);
  $('#stCancel').onclick = close;
  const ib = $('#stImportBtn');
  if(ib) ib.onclick = async ()=>{
    const raw = $('#stImport').value.trim().replace(/^DENNIK1:/, '');
    let src; try{ src = JSON.parse(raw); }catch(e){ toast('Kód sa nedá prečítať. Skopíruj ho celý.'); return; }
    ib.disabled = true; ib.textContent = 'Nahrávam…';
    try{ const c = await runImport(src); close(); toast(c ? 'Nahraté: '+c+' zápisov' : 'Nič nové na nahratie'); }
    catch(e){ ib.disabled = false; ib.textContent = 'Nahrať zápisy'; toast('Nahratie zlyhalo. Skús to znova.'); }
  };
  $('#stSave').onclick = ()=>{ const st = parseInt($('#stSteps').value,10), kc = parseInt($('#stKcal').value,10); state.settings = Object.assign({}, state.settings, {stepsTarget: st>0?st:10000, kcalTarget: kc>0?kc:null}); saveSettings(); render(); close(); toast('Ciele uložené'); };
}
function openEditor(id){
  const h = state.habits.find(x=>x.id===id); if(!h) return;
  const idx = state.habits.indexOf(h);
  const close = sheet(`<h3>Upraviť návyk<small>${esc(h.name)}</small></h3>
    <div class="f"><label for="edName">Názov</label><input id="edName" value="${esc(h.name)}" maxlength="60"></div>
    <div class="f"><label for="edGoal">Cieľ · dní v mesiaci</label><input id="edGoal" type="number" min="1" max="31" inputmode="numeric" value="${h.goal||''}" placeholder="každý deň"><small>Napríklad Gym 16× za mesiac. Prázdne znamená každý deň.</small></div>
    <div class="acts"><div style="display:flex"><button class="b" id="edUp" ${idx===0?'disabled':''} aria-label="Posunúť vyššie">↑</button><button class="b" id="edDown" ${idx===state.habits.length-1?'disabled':''} aria-label="Posunúť nižšie">↓</button><button class="b bad" id="edDel">Odstrániť</button></div><div class="r"><button class="b" id="edCancel">Zrušiť</button><button class="b fill" id="edSave">Uložiť</button></div></div>`);
  $('#edCancel').onclick = close;
  $('#edSave').onclick = ()=>{ const name = $('#edName').value.trim(); if(!name){ $('#edName').focus(); return; } const g = parseInt($('#edGoal').value,10); h.name = name; h.goal = g>0?g:null; saveHabit(h); render(); close(); toast('Uložené'); };
  const swap = dir => { const o = state.habits[idx+dir]; if(!o) return; const t = h.order; h.order = o.order; o.order = t; if(h.order===o.order) o.order = h.order+dir; state.habits.sort((a,b)=>a.order-b.order); saveHabit(h); saveHabit(o); render(); close(); openEditor(h.id); };
  $('#edUp').onclick = ()=>swap(-1); $('#edDown').onclick = ()=>swap(1);
  let armed = false;
  $('#edDel').onclick = ()=>{ if(!armed){ armed = true; $('#edDel').textContent = 'Naozaj odstrániť?'; return; } deleteHabit(h.id); render(); close(); toast('Návyk odstránený'); };
  setTimeout(()=>{ const i=$('#edName'); if(i) i.focus(); }, 30);
}

/* tooltips + toast */
const tip = $('#tip');
document.addEventListener('pointermove', e=>{ const t = e.target.closest && e.target.closest('[data-tip]'); if(!t){ tip.classList.remove('show'); return; } tip.textContent = t.dataset.tip; tip.style.left = e.clientX+'px'; tip.style.top = e.clientY+'px'; tip.classList.add('show'); });
document.addEventListener('pointerdown', e=>{ if(!(e.target.closest && e.target.closest('[data-tip]'))) tip.classList.remove('show'); });
let toastT; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 1600); }

/* boot */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState!=='visible') return;
  const pYm = TODAY.ym, pD = TODAY.d; refreshToday();
  if(pYm===TODAY.ym && pD===TODAY.d) return;
  if(state.ym===pYm && pYm!==TODAY.ym){ state.ym = TODAY.ym; delete $('#gridwrap').dataset.scrolled; loadMonth(); } else render();
});
state.month = emptyMonth();
render();
initStore();
})();
</script>
